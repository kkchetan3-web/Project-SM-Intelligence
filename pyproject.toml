[project]
name = "sm-intel"
version = "0.3.0"
description = "Satta Matka Quantitative Research Platform - reproducible statistical research over market result histories"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SM Intelligence Research Platform" }]
keywords = ["quantitative-research", "statistics", "time-series", "backtesting", "reproducibility"]

# Pinned to the versions the platform was actually executed against.
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "scipy>=1.11,<2",
    "statsmodels>=0.14,<0.16",
    "scikit-learn>=1.4,<2",
    "matplotlib>=3.8,<4",
    "PyYAML>=6.0,<7",
    "requests>=2.31,<3",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.0,<7",
    "pyarrow>=15,<27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
sm-intel = "src.cli.main:main"

[tool.setuptools]
packages = [
    "src", "src.core", "src.ingestion", "src.storage", "src.preprocessing",
    "src.mathematics", "src.cross_market", "src.backtesting", "src.models",
    "src.predictions", "src.cli", "src.reporting",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: computationally heavy tests",
    "network: tests that require outbound network access (skipped by default)",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]
