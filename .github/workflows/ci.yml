name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Lint (ruff, non-blocking on style only)
        run: |
          pip install ruff
          ruff check src tests scripts || true

      - name: Unit tests (excluding slow integration tests)
        env:
          # The tests build their own throwaway databases; no network is used.
          SM_INTEL_DATABASE_ROOT: ${{ runner.temp }}/sm-intel-db
        run: pytest -m "not slow" --strict-markers -q

      - name: Registry integrity gate
        run: |
          python - <<'PY'
          from src.mathematics.registry import validate_registry
          report = validate_registry()
          print(report)
          assert report["ok"], report
          assert report["n_documented"] == 100 == report["n_implemented"]
          PY
